name: VarunyaTech Production CI Pipeline

on:
  push:
    branches: [ main, staging ]
  pull_request:
    branches: [ main ]

jobs:
  validate-and-build:
    name: Type-Check, Lint & Production Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20 LTS
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Clean Dependency Installation
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: TypeScript Static Type Check
        run: npx tsc --noEmit

      - name: Build Production Next.js Application
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: 1
          NODE_ENV: production
